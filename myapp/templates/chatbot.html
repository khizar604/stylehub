    <!DOCTYPE html>
    <html>
    <head>
        <title>StyleHub Chatbot</title>
    </head>
    <body>
        
    
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Chatbot</title>
            <style>
                /* Chatbot Container */
                #chatbot-container {
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    z-index: 1000;
                    font-family: Arial, sans-serif;
                }

                 /* Chatbot Icon */
                        @media (max-width: 480px) {
                            /* #chatbot-icon {
                                margin-bottom: 100px;
                    } */
                            #chatbot-container{
                                bottom: 20px;
                                z-index: 1000;
                            }
                }
        
                /* Chatbot Icon */
                #chatbot-icon {
                    width: 60px;
                    height: 60px;
                    background-color: #e7ab3c;
                    color: white;
                    font-size: 30px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 50%;
                    cursor: pointer;
                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
                    margin-bottom: 100px;
                }
        
                /* Chatbot Window */
                #chat-widget {
                    display: none;
                    position: fixed;
                    bottom: 80px;
                    right: 20px;
                    width: 350px;
                    background: white;
                    border-radius: 10px;
                    box-shadow: 0 0 20px rgba(0,0,0,0.1);
                    z-index: 1000;
                    transition: transform 0.3s ease;
                }
        
                #chat-header {
                    background: #e7ab3c;
                    color: white;
                    padding: 15px;
                    border-radius: 10px 10px 0 0;
                    cursor: pointer;
                    font-weight: bold;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
        
                #chat-messages {
                    height: 400px;
                    overflow-y: auto;
                    padding: 15px;
                    transition: height 0.3s ease;
                    background-color: #f9f9f9;
                }
        
                .message {
                    margin: 10px 0;
                    display: flex;
                }
        
                .bubble {
                    max-width: 80%;
                    padding: 10px 15px;
                    border-radius: 20px;
                    word-break: break-word;
                }
        
                .user .bubble {
                    background: #e7ab3c;
                    color: white;
                    margin-left: auto;
                }
        
                .bot .bubble {
                    background: #f1f1f1;
                    color: #333;
                    margin-right: auto;
                }
        
                #chat-input {
                    display: flex;
                    padding: 15px;
                    border-top: 1px solid #eee;
                    transition: opacity 0.3s ease;
                }
        
                #user-message {
                    flex: 1;
                    padding: 8px 15px;
                    border: 1px solid #ddd;
                    border-radius: 20px;
                    margin-right: 10px;
                    outline: none;
                }
        
                #chat-input button {
                    padding: 8px 20px;
                    border: none;
                    border-radius: 20px;
                    background: #e7ab3c;
                    color: white;
                    cursor: pointer;
                }
        
                #chat-input button:hover {
                    background: #e7ab3c;
                }
            </style>
        </head>
        <body>
            <div id="chatbot-container">
                <div id="chatbot-icon" onclick="toggleChatbot()">💬</div>
                <div id="chat-widget">
                    <div id="chat-header">
                        <span>Fashion Assistant</span>
                        <button onclick="toggleChatbot()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✖</button>
                    </div>
                    <div id="chat-messages"></div>
                    <div id="chat-input">
                        <input type="text" id="user-message" placeholder="Ask about trends, products, or orders..." autocomplete="off">
                        <button onclick="sendChatMessage()">Send</button>
                    </div>
                </div>
            </div>
            
            <script>
                function toggleChatbot() {
                    const chatbot = document.getElementById('chat-widget');
                    chatbot.style.display = chatbot.style.display === 'none' || chatbot.style.display === '' ? 'block' : 'none';
                }
        
                const chatMessages = document.getElementById('chat-messages');
                const userInput = document.getElementById('user-message');
                const sendButton = document.querySelector('#chat-input button');
        
                function appendMessage(role, text) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${role}`;
                    messageDiv.innerHTML = `<div class="bubble">${text}</div>`;
                    chatMessages.appendChild(messageDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
        
                async function sendChatMessage() {
                    const message = userInput.value.trim();
                    if (!message) return;
        
                    userInput.value = '';
                    userInput.disabled = true;
                    sendButton.disabled = true;
        
                    try {
                        appendMessage('user', message);
                        
                        const response = await fetch("/chatbot/", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": "{{ csrf_token }}"
                            },
                            body: JSON.stringify({message: message})
                        });
        
                        if (!response.ok) throw new Error('Network error');
                        const data = await response.json();
                        
                        appendMessage('bot', data.response);
                    } catch (error) {
                        appendMessage('bot', 'Sorry, I m having trouble responding. Please try again.');
                        console.error('Error:', error);
                    } finally {
                        userInput.disabled = false;
                        sendButton.disabled = false;
                        userInput.focus();
                    }
                }
        
                userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendChatMessage();
                });
        
                sendButton.addEventListener('click', sendChatMessage);
            </script>
        </body>
        </html>
