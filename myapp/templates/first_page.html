<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', system-ui;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin: 1rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardEntrance 0.6s ease-out;
            cursor: pointer;
            border: none;
            text-align: center;
            height: 100%;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .login-card:active {
            transform: scale(0.98);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #e7ab3c, #d19b34);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: transform 0.3s ease;
        }

        .brand-card .card-icon {
            background: linear-gradient(45deg, #417690, #3a6a7f);
        }

        .login-card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2d3748;
            font-weight: 600;
        }

        .card-description {
            color: #718096;
            margin-bottom: 2rem;
        }

        .btn-customer {
            background: #e7ab3c;
            color: white;
            border: none;
            padding: 1rem 2rem;
        }

        .btn-customer:hover {
            background: #d19b34;
            color: white;
        }

        .btn-brand {
            background: #417690;
            color: white;
            border: none;
            padding: 1rem 2rem;
        }

        .btn-brand:hover {
            background: #3a6a7f;
            color: white;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            color: #718096;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .login-card {
                margin: 0.5rem;
                padding: 1.5rem;
            }
            
            .card-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <!-- Customer Card -->
            <div class="col-md-5 mb-4">
                <a href="{% url 'user_login' %}" class="text-decoration-none">
                    <div class="login-card">
                        <i class="fas fa-shopping-bag card-icon"></i>
                        <h3 class="card-title">Customer Access</h3>
                        <p class="card-description">
                            Explore products, shop securely, and track orders
                        </p>
                        <div class="d-grid">
                            <button class="btn btn-customer btn-lg">
                                Enter Marketplace <i class="fas fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Divider -->
            <div class="col-md-12 text-center">
                <div class="divider">
                    OR
                </div>
            </div>

            <!-- Brand Partner Card -->
            <div class="col-md-5">
                <a href="{% url 'partner_page' %}" class="text-decoration-none">
                    <div class="login-card brand-card">
                        <i class="fas fa-briefcase card-icon"></i>
                        <h3 class="card-title">Brand Portal</h3>
                        <p class="card-description">
                            Manage inventory, orders, and business analytics
                        </p>
                        <div class="d-grid">
                            <button class="btn btn-brand btn-lg">
                                Partner Dashboard <i class="fas fa-chart-line ms-2"></i>
                            </button>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
