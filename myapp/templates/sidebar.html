<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 250px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            padding: 20px;
            transition: right 0.3s ease-in-out;
        }
        .sidebar.open {
            right: 0;
        }
        .filter-heading {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        .checkbox-group label {
            display: block;
            margin-bottom: 5px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .tag {
            padding: 5px 10px;
            background: #ddd;
            border-radius: 3px;
            cursor: pointer;
        }
        .tag:hover {
            background: #bbb;
        }
        .filter-button {
            position: fixed;
            right: 20px;
            top: 20px;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        .close-btn {
            cursor: pointer;
            float: right;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button class="filter-button" onclick="toggleSidebar()">Open Filters</button>

    <div class="sidebar" id="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        
        <form id="filterForm" method="GET">
            <div class="filter-heading">Brand</div>
            <div class="checkbox-group">
                <label><input type="radio" name="type" value="Casual Wear"> Casual Wear</label>
                <label><input type="radio" name="type" value="Formal Wear"> Formal Wear</label>
                <label><input type="radio" name="type" value="Party Wear"> Party Wear</label>
                <label><input type="radio" name="type" value="Seasonal Wear"> Seasonal Wear</label>
            </div>

            <div class="filter-heading">Color</div>
            <div class="checkbox-group">
                <label><input type="radio" name="color" value="Dark"> Dark</label>
                <label><input type="radio" name="color" value="Light"> Light</label>
            </div>

            <div class="filter-heading">Size</div>
            <div class="checkbox-group">
                <label><input type="radio" name="type" value=""> Small</label>
                <label><input type="radio" name="type" value=""> Medium</label>
                <label><input type="radio" name="type" value=""> Large</label>
                <label><input type="radio" name="type" value=""> Xtra Large</label>
            </div>

            <div class="filter-heading">Tags</div>
            <div class="tags">
                <span class="tag" onclick="applyTag('Shirts')">Shirts</span>
                <span class="tag" onclick="applyTag('Pants')">Pants</span>
                <span class="tag" onclick="applyTag('Coats')">Coats</span>
                <span class="tag" onclick="applyTag('Jackets')">Jackets</span>
                <span class="tag" onclick="applyTag('t-Shirts')">T-Shirts</span>
                <span class="tag" onclick="applyTag('Suits')">Suits</span>
            </div>

            <button type="submit" style="margin-top: 10px; padding: 8px; background: green; color: white; border: none; cursor: pointer;">
                Apply Filters
            </button>
        </form>
    </div>

    <div style="margin: 20px;">
        <div class="row">
            {% for product in products %}
            <div class="col-lg-4 col-sm-6">
                <div class="product-item">
                    <div class="pi-pic">
                        <img src="{{ product.hero_image.url }}" alt="{{ product.name }}"  style="width: 100%; height: 300px; ">
                        {% if product.discount_price %}
                        <div class="sale pp-sale">Sale</div>
                        {% endif %}
                        <div class="icon">
                            <i class="icon_heart_alt"></i>
                        </div>
                        <ul>
                            <li class="w-icon active"><a href="#"><i class="icon_bag_alt"></i></a></li>
                            <li class="quick-view"><a href="{% url 'product_detail' product.name %}">+ Quick View</a></li>
                            <li class="w-icon"><a href="#"><i class="fa fa-random"></i></a></li>
                        </ul>
                    </div>
                    <div class="pi-text">
                        <a href="#">
                            <h5>{{ product.name }}</h5>
                        </a>
                        <div class="product-price">
                            ${{ product.price }}
                            {% if product.discount_price %}
                            <span>${{ product.discount_price }}</span>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
    </div>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById("sidebar");
            sidebar.classList.toggle("open");
        }

        function applyTag(tagValue) {
            let input = document.createElement("input");
            input.type = "hidden";
            input.name = "subtype";
            input.value = tagValue;
            document.getElementById("filterForm").appendChild(input);
            document.getElementById("filterForm").submit();
        }
    </script>

</body>
</html>
